app:
  name: challengePlanet
  display_name: "星轨挑战"
  description: "AI驱动的挑战打卡工具"
  app_group: "学习成长"
  icon_url: "icon.svg"
  is_public: true
  workers: 1
  path_prefix: /challengePlanet
  depends_on: ["usercenter", "lion", "prompt-manager", "beeMemory"]

build:
  python: 3.12
  prepare:
    - python3 -m pip install -i https://pypi.tuna.tsinghua.edu.cn/simple -r requirements.txt

run:
  web: python3 -m uvicorn app.main:app --host 0.0.0.0 --port ${PORT} --timeout-keep-alive 30

env:
  PORT: "8610"
  SERVICE_TOKEN: "${SERVICE_TOKEN}"
  LION_NAMESPACE: challengePlanet
  LION_BASE_URL: "http://localhost:9527"
  BEEMEMORY_BASE_URL: "http://localhost:8700"
  UC_BASE_URL: "https://songguokr.com/uc-api"
  UC_APP_KEY: "${UC_APP_KEY}"
  UC_APP_SECRET: "${UC_APP_SECRET}"
  UC_ENABLED: "true"
  TZ: "Asia/Shanghai"

secrets:
  - UC_APP_KEY
  - UC_APP_SECRET

health:
  path: /health
  interval: 30
