app:
  name: challengePlanet
  display_name: "星轨挑战"
  description: "AI驱动的习惯养成与目标挑战工具"
  app_group: "学习成长"
  tags: ["学习","打卡","目标","习惯"]
  icon_url: "icon.svg"
  is_public: true
  workers: 1
  path_prefix: /challengePlanet
  depends_on: ["lion","prompt-manager","beeMemory"]

build:
  python: 3.12
  prepare:
    - python3 -m pip install -i https://pypi.tuna.tsinghua.edu.cn/simple -r requirements.txt

run:
  web: python3 -m uvicorn app.main:app --host 0.0.0.0 --port ${PORT} --timeout-keep-alive 30

env:
  PM_GATEWAY_API_KEY: "${PM_GATEWAY_API_KEY}"
  TZ: "Asia/Shanghai"

secrets:
  - PM_GATEWAY_API_KEY

health:
  path: /health
  interval: 30
