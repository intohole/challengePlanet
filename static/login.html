<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
<title>星轨挑战 · AI打卡教练</title>
<script>window.PATH_PREFIX = window.PATH_PREFIX || ''</script>
<link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://songguokr.com/nexus-ui/v2.10.30/css/nexus-all.css">
<link rel="stylesheet" href="/static/style.css?v=20260825b">
<link rel="stylesheet" href="/static/style-components.css?v=20260825b">
<link rel="stylesheet" href="/static/login-extra.css?v=20260821">
<script src="https://cdn.bootcdn.net/ajax/libs/vue/3.4.21/vue.global.prod.min.js"></script>
<script src="https://songguokr.com/nexus-ui/v2.10.30/js/nexus-all.js"></script>
<script src="https://songguokr.com/nexus-ui/v2.10.30/js/components/nux-app-switcher.js"></script>
<script src="https://songguokr.com/nexus-ui/v2.10.30/js/components/nux-login-page.js"></script>
<script>window.UC_CONFIG_URL = (window.PATH_PREFIX || '') + '/api/v1/auth/config'</script>


</head>
<body>
<div class="cp-nebula"><i class="nb1"></i><i class="nb2"></i><i class="nb3"></i><i class="nb4"></i></div>
<div class="cp-starfield" id="starfield"></div>
<div class="cp-dust" id="dust"></div>
<div id="app" v-cloak>
  <nux-login-page
    app-name="星轨挑战"
    app-icon="☄️"
    slogan="AI 打卡教练 · 陪你每一天"
    description="说一个目标，AI 帮你拆解每一天"
    variant="split"
    :features="loginFeatures"
    :show-register="true"
    :loading="isLoading"
    :error="loginError"
    @login="handleLogin"
    @register="handleRegister"
  >
    <template #footer>
      <button v-if="hasSession" @click="continueSession" class="cp-continue-btn">继续上次挑战 →</button>
    </template>
  </nux-login-page>
</div>
<script>
;(function () {
  var sf = document.getElementById('starfield')
  var dust = document.getElementById('dust')
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches
  var isMobile = window.innerWidth < 768

  if (sf) {
    var count = isMobile ? 50 : 130
    var html = ''
    for (var i = 0; i < count; i++) {
      var size = Math.random() * 1.6 + 1
      var x = Math.random() * 100, y = Math.random() * 100
      var delay = Math.random() * 4, dur = 2.2 + Math.random() * 3
      html += '<div class="cp-star" style="left:' + x.toFixed(1) + '%;top:' + y.toFixed(1) + '%;width:' + size.toFixed(2) + 'px;height:' + size.toFixed(2) + 'px;animation-delay:' + delay.toFixed(2) + 's;animation-duration:' + dur.toFixed(2) + 's"></div>'
    }
    html += '<div class="cp-shooting-star" style="top:18%;left:8%;animation-delay:2.5s"></div>'
    html += '<div class="cp-shooting-star" style="top:55%;left:38%;animation-delay:7s"></div>'
    html += '<div class="cp-shooting-star" style="top:34%;left:64%;animation-delay:12s"></div>'
    sf.innerHTML = html
  }

  if (dust && !reduce) {
    var dustN = isMobile ? 10 : 26
    var html2 = ''
    for (var j = 0; j < dustN; j++) {
      var dSize = Math.random() * 2.5 + 1.5
      html2 += '<i style="left:' + (Math.random() * 100).toFixed(1) + '%;bottom:-8px;width:' + dSize.toFixed(1) + 'px;height:' + dSize.toFixed(1) + 'px;animation-duration:' + (9 + Math.random() * 12).toFixed(1) + 's;animation-delay:' + (Math.random() * 14).toFixed(1) + 's"></i>'
    }
    dust.innerHTML = html2
  }

})()

const { createApp, ref, onMounted } = Vue
window.api = new NexusApi({ baseUrl: (window.PATH_PREFIX || '') + '/api/v1', tokenKey: 'uc_access_token' })
const LoginApp = createApp({
  setup() {
    const isLoading = ref(false)
    const loginError = ref('')
    const hasSession = ref(false)
    const loginFeatures = [
      { icon: '🌌', title: '星系进度', desc: '每个挑战都是一颗行星，点亮它的每一步轨迹' },
      { icon: '🤖', title: 'AI教练', desc: '自动生成每日计划，打卡后还有暖心反馈' },
      { icon: '👥', title: '小队互相监督', desc: '邀请好友组队，全员打卡人人加分' },
      { icon: '🎁', title: '积分宝箱', desc: '连续打卡积分递增，随机掉落惊喜宝箱' }
    ]
    onMounted(() => { if (localStorage.getItem('uc_access_token')) hasSession.value = true })
    async function handleLogin(form) {
      if (!form || !form.username || !form.password) { loginError.value = '请输入用户名和密码'; return }
      loginError.value = ''
      isLoading.value = true
      try {
        const res = await window.api.post('/auth/login', { username: form.username.trim(), password: form.password })
        const d = res.data || res
        if (!d.access_token) throw new Error('登录失败：未获取到令牌')
        localStorage.setItem('uc_access_token', d.access_token)
        if (d.refresh_token) localStorage.setItem('uc_refresh_token', d.refresh_token)
        const user = d.user || {}
        localStorage.setItem('cp_user_id', String(user.id || user.user_id || user.username || form.username.trim()))
        localStorage.setItem('cp_nickname', String(user.nickname || user.name || user.username || form.username.trim()))
        window.location.href = (window.PATH_PREFIX || '') + '/'
      } catch (e) {
        loginError.value = (window.mapHttpError && e.name === 'NexusApiError') ? window.mapHttpError(e) : (e.message || '登录失败，请检查用户名和密码')
      } finally { isLoading.value = false }
    }
    function continueSession() { window.location.href = (window.PATH_PREFIX || '') + '/' }
    async function handleRegister(form) {
      if (!form || !form.username || !form.password) { loginError.value = '请输入用户名和密码'; return }
      if (form.password !== form.confirmPassword) { loginError.value = '两次输入的密码不一致'; return }
      loginError.value = ''
      isLoading.value = true
      try {
        const res = await window.api.post('/auth/register', { username: form.username.trim(), password: form.password, email: (form.email || '').trim() })
        const d = res.data || res
        if (!d.access_token) throw new Error('注册失败：未获取到令牌')
        localStorage.setItem('uc_access_token', d.access_token)
        if (d.refresh_token) localStorage.setItem('uc_refresh_token', d.refresh_token)
        const user = d.user || {}
        localStorage.setItem('cp_user_id', String(user.id || user.user_id || user.username || form.username.trim()))
        localStorage.setItem('cp_nickname', String(user.nickname || user.name || user.username || form.username.trim()))
        window.location.href = (window.PATH_PREFIX || '') + '/'
      } catch (e) {
        loginError.value = (window.mapHttpError && e.name === 'NexusApiError') ? window.mapHttpError(e) : (e.message || '注册失败，请稍后重试')
      } finally { isLoading.value = false }
    }
    return { isLoading, loginError, hasSession, loginFeatures, handleLogin, handleRegister, continueSession }
  }
})
LoginApp.component('nux-login-page', window.NuxLoginPage)
LoginApp.mount('#app')
</script>
</body>
</html>
